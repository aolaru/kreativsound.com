name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build site
        run: npm run build

      - name: Check sitemap freshness
        run: npm run sitemap:check

      - name: Check product data
        run: npm run check:products

      - name: Check Preset Mutator
        run: npm run check:preset-mutator

      - name: Check Preset Mutator PRO
        run: npm run check:preset-mutator-pro

      - name: Check product assets
        run: python3 scripts/check-product-assets.py

      - name: Check thumbnail quality
        run: npm run check:thumbnails

      - name: Check Wave Mutator
        run: npm run check:wave-mutator

      - name: Check search index
        run: npm run check:search

      - name: Check internal links
        run: npm run check:links

      - name: Check page metadata
        run: npm run check:metadata

      - name: Run rendered smoke checks
        run: python3 scripts/smoke-site.py

      - name: Run Preset Mutator smoke checks
        run: npm run smoke:preset-mutator

      - name: Run Lighthouse and verify thresholds
        run: |
          for attempt in 1 2; do
            echo "Lighthouse attempt ${attempt}/2"
            if bash scripts/lighthouse-check.sh && python3 scripts/check-lighthouse-thresholds.py; then
              exit 0
            fi

            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi

            echo "Lighthouse thresholds missed; retrying once to avoid a transient measurement failure."
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
