name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:
    inputs:
      run_lighthouse:
        description: Run Lighthouse and enforce quality thresholds
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build site
        run: npm run build

      - name: Validate site and tools
        shell: bash
        run: |
          set -euo pipefail
          npm run sitemap:check
          npm run check:products
          npm run check:preset-mutator
          npm run check:preset-mutator-pro
          python3 scripts/check-product-assets.py
          npm run check:thumbnails
          npm run check:wave-mutator
          npm run check:tool-releases
          npm run check:search
          npm run check:links
          npm run check:metadata
          python3 scripts/smoke-site.py
          npm run smoke:preset-mutator

      - name: Run Lighthouse and verify thresholds
        if: github.event_name == 'workflow_dispatch' && inputs.run_lighthouse
        run: |
          for attempt in 1 2; do
            echo "Lighthouse attempt ${attempt}/2"
            if bash scripts/lighthouse-check.sh && python3 scripts/check-lighthouse-thresholds.py; then
              exit 0
            fi

            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi

            echo "Lighthouse thresholds missed; retrying once to avoid a transient measurement failure."
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
