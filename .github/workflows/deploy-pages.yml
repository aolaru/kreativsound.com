name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build site
        run: PUBLIC_DISABLE_ANALYTICS=true npm run build

      - name: Check sitemap freshness
        run: npm run sitemap:check

      - name: Check product data
        run: npm run check:products

      - name: Check product assets
        run: python3 scripts/check-product-assets.py

      - name: Check thumbnail quality
        run: npm run check:thumbnails

      - name: Check Wave Mutator
        run: npm run check:wave-mutator

      - name: Check search index
        run: npm run check:search

      - name: Check internal links
        run: npm run check:links

      - name: Run rendered smoke checks
        run: python3 scripts/smoke-site.py

      - name: Run Preset Mutator smoke checks
        run: npm run smoke:preset-mutator

      - name: Run Lighthouse
        run: bash scripts/lighthouse-check.sh

      - name: Verify Lighthouse thresholds
        run: python3 scripts/check-lighthouse-thresholds.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
